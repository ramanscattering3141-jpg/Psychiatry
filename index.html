<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroPharm Atlas</title>
<meta name="description" content="Interactive psychiatry pharmacology and neurocircuitry atlas: brain regions, circuits, neurotransmitters, receptors, medications and mechanism-based side effects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2379a8f0'/%3E%3Cpath d='M9 18c2-6 6-8 9-5s5 1 6-2' stroke='%230b1016' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="assets/css/app.css">
<script>try{var t=localStorage.getItem('pa.theme');if(t)document.documentElement.dataset.theme=JSON.parse(t);if(JSON.parse(localStorage.getItem('pa.reduced')))document.documentElement.classList.add('reduced-motion');}catch(e){}</script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Main navigation">
    <a class="brand" href="#/">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M8 18c2-6 6-8 9-5s5 1 7-2" stroke="var(--nt-DA)" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M9 21c3-2 6-2 8 0s5 1 6-1" stroke="var(--nt-5HT)" stroke-width="2" fill="none" stroke-dasharray="3 2" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="var(--nt-NE)"/></svg>
      <span><b>NeuroPharm Atlas</b><span>Psychiatric pharmacology &amp; neurocircuitry</span></span></a>
    <div class="nav" id="nav"></div>
  </nav>
  <div class="main">
    <header class="topbar">
      <button class="toggle menu-btn" id="menu" aria-label="Open navigation">☰</button>
      <div class="search-wrap" role="combobox" aria-haspopup="listbox" aria-owns="qres">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search regions, receptors (H1, D2, α2…), drugs, side effects, disorders, doses…   ( / )" aria-label="Global search" aria-controls="qres">
        <div class="search-results" id="qres" role="listbox" hidden></div>
      </div>
      <div class="top-actions">
        <button class="toggle" id="rxmode" aria-pressed="false" title="Prescriber mode: drug pages open on prescribing information"><span aria-hidden="true">℞</span> <span class="lbl">Prescriber</span></button>
        <button class="toggle" id="motion" aria-pressed="false" title="Reduced motion"><span aria-hidden="true">◌</span> <span class="lbl">Reduce motion</span></button>
        <button class="toggle" id="theme" aria-pressed="false" title="Toggle light/dark theme"><span aria-hidden="true">◐</span> <span class="lbl">Dark</span></button>
      </div>
    </header>
    <main id="main-content" tabindex="-1"><div class="page" id="page"></div></main>
  </div>
</div>
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="close-x" aria-label="Close">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>
